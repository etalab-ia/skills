name: Sync datagouv skill
on:
  schedule:
    - cron: '0 9 * * 1'  # Lundi 9h UTC
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
      - name: Check upstream
        id: check
        run: |
          git clone --depth=1 https://github.com/datagouv/datagouv-skill.git /tmp/upstream

          # On suit le hash du blob SKILL.md, pas le HEAD du dépôt : seul ce
          # fichier est synchronisé, donc un commit upstream sur README/LICENSE
          # ne doit pas ouvrir de PR.
          UPSTREAM_BLOB=$(cd /tmp/upstream && git rev-parse HEAD:SKILL.md)
          UPSTREAM_COMMIT=$(cd /tmp/upstream && git rev-parse HEAD)
          LOCAL_BLOB=$(cat .sync-state/datagouv.sha 2>/dev/null || echo "")

          if [ "$UPSTREAM_BLOB" != "$LOCAL_BLOB" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "blob=$UPSTREAM_BLOB" >> $GITHUB_OUTPUT
            echo "commit=$UPSTREAM_COMMIT" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi
      - name: Sync files
        if: steps.check.outputs.changed == 'true'
        env:
          BLOB: ${{ steps.check.outputs.blob }}
        run: |
          cp /tmp/upstream/SKILL.md skills/datagouv-apis/SKILL.md
          echo "$BLOB" > .sync-state/datagouv.sha
      - name: Create PR
        if: steps.check.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BLOB: ${{ steps.check.outputs.blob }}
          COMMIT: ${{ steps.check.outputs.commit }}
        run: |
          BRANCH="sync/datagouv-$(date +%Y%m%d)"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Delete remote branch if it exists (stale from previous failed run)
          git push origin --delete "$BRANCH" 2>/dev/null || true

          git checkout -b "$BRANCH"
          git add skills/datagouv-apis/SKILL.md .sync-state/datagouv.sha
          git commit -m "chore(datagouv): sync upstream changes"
          git push origin "$BRANCH"
          gh pr create \
            --title "chore(datagouv): sync upstream changes" \
            --body "$(cat <<EOF
          Mise à jour automatique de la skill datagouv depuis [datagouv/datagouv-skill](https://github.com/datagouv/datagouv-skill).

          Commit upstream : [\`${COMMIT:0:7}\`](https://github.com/datagouv/datagouv-skill/commit/${COMMIT})
          Blob \`SKILL.md\` : \`${BLOB}\`
          EOF
          )"
